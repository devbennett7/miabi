# Managing GitOps projects from one folder.
#
# A GitSource is a GitOps project: a Git path of manifests the workspace keeps
# reconciled. Apply this file once and every project below is created and
# synced straight away; syncPolicy: auto keeps it in step with Git after that.
#
# Committed to a GitOps project's own repository instead, these become nested
# projects ("app of apps"): the root project creates and prunes them, and they
# are locked in the UI. Nesting stops at three levels, and a project can never
# declare itself or one of its parents.
#
# Apply with:  miabi apply -f gitsources.yaml
---
# The clone token lives in the vault. Seal it (`miabi secrets seal`) and use
# kind: SealedSecret instead to commit this file.
apiVersion: miabi.io/v1
kind: Secret
metadata:
  name: github-token
spec:
  value: ghp_replace_me
---
# A Git credential. It never holds the token itself, only the vault entry to
# read it from at every clone, so rotating the Secret rotates the credential.
# The examples repository is public; a token is what a private one (or your
# own fork) needs.
apiVersion: miabi.io/v1
kind: GitRepository
metadata:
  name: miabi-examples
spec:
  url: https://github.com/miabi-io/examples.git
  auth: token            # public | token | ssh
  secretRef: github-token
---
apiVersion: miabi.io/v1
kind: GitSource
metadata:
  name: full-stack
spec:
  # The credential supplies the URL and the clone token. Use repo: <url> instead
  # for a public repository.
  repository: miabi-examples
  ref: main
  path: gitops/full-stack
  syncPolicy: auto
  prune: true
  requireSealedSecrets: true
---
apiVersion: miabi.io/v1
kind: GitSource
metadata:
  name: laravel
spec:
  repo: https://github.com/miabi-io/examples.git
  path: gitops/laravel
  # Deleting this project (or removing it from the file under --prune) also
  # removes the apps it deployed. The default, orphan, leaves them running.
  deletePolicy: cascade
